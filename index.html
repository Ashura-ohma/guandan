<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a29"><title>星曜掼蛋</title><link rel="stylesheet" href="style.css"></head><body>
<div class="ambient a"></div><div class="ambient b"></div>
<header><a class="brand" href="#"><span class="brand-icon">♠</span><div>星曜掼蛋<small>GUANDAN · AFTER HOURS</small></div></a><div class="header-tools"><span class="offline"><i></i> 离线畅玩</span><button class="icon-button" id="help" aria-label="玩法说明">?</button><button class="icon-button" id="settings" aria-label="设置">⚙</button></div></header>
<main id="lobby"><section class="hero"><div class="eyebrow">DOUBLE DECK. DOUBLE THE GAME.</div><h1>好牌，<br><span>配好搭档。</span></h1><p>两副牌，四位玩家，无限可能。<br>在霓虹牌桌上，和你的 AI 搭档默契出击。</p><div class="hero-tags"><span>108 张双副牌</span><span>红桃级牌百搭</span><span>智能提示</span></div><div class="hero-cards"><div class="hero-card hc1">A<span>♠</span></div><div class="hero-card hc2">A<span>♥</span><small>逢人配</small></div><div class="hero-card hc3">A<span>♣</span></div></div></section>
<section class="modes"><div class="section-title"><span>今晚，怎么打？</span><small>CHOOSE YOUR TABLE</small></div><button class="mode primary" data-mode="classic"><span class="mode-icon">♠</span><div><small>CLASSIC MATCH</small><h2>经典升级</h2><p>从 2 打到 A · 双人搭档 · 连续对局</p></div><b>↗</b></button><div class="mode-grid"><button class="mode" data-mode="quick"><span class="mode-icon">ϟ</span><div><small>QUICK PLAY</small><h2>快速开局</h2><p>随机级牌，随时来一局</p></div><b>↗</b></button><button class="mode" data-mode="practice"><span class="mode-icon">✦</span><div><small>TRAINING</small><h2>明牌练习</h2><p>查看四家手牌，磨炼牌技</p></div><b>↗</b></button></div><div class="stats"><div><strong id="stat-rounds">0</strong><span>完成对局</span></div><div><strong id="stat-wins">0</strong><span>搭档胜场</span></div><div><strong id="stat-rate">—</strong><span>胜率</span></div><span class="stats-caption">记录留在你的设备上</span></div></section></main>
<main id="game" hidden><div class="matchbar"><button class="text-button" id="home">‹ 大厅</button><div><span id="mode-label">经典升级</span><span class="pill">打 <b id="level-label">2</b></span></div><button class="text-button" id="auto">托管 关</button></div><section class="table"><div class="table-line"></div><div class="watermark">星曜<br><small>GUANDAN CLUB</small></div><div class="seat seat-top" id="seat-2"></div><div class="seat seat-left" id="seat-1"></div><div class="seat seat-right" id="seat-3"></div><div id="played" class="played"></div><div id="table-status" class="table-status">你的搭档坐在对面</div><div class="team-score"><span>我方 <b id="score-us">2</b></span><span>对方 <b id="score-them">2</b></span></div><button id="history" class="history-button">牌局记录</button></section><section class="player-zone"><div class="player-meta"><div><span class="you-avatar">♠</span><b>你</b><span id="hand-count">27 张</span><span id="turn-status"></span></div><button class="text-button" id="sort">⇅ 理牌</button></div><div class="hand" id="hand" aria-label="你的手牌"></div><div class="actionbar"><button class="secondary" id="pass">不出</button><button class="secondary" id="hint">✦ 提示</button><button class="secondary compact" id="clear">重选</button><button class="play-button" id="play">出牌 <span>↗</span></button></div><div id="selection-status" class="selection-status">点击牌面选牌，再点击出牌</div></section></main>
<div id="toast" role="status"></div><dialog id="modal"><button class="modal-close" id="modal-close" aria-label="关闭">×</button><div id="modal-content"></div></dialog><script type="module" src="game.js"></script></body></html>
