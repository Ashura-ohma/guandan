<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d2a"><title>星曜掼蛋</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="#" aria-label="星曜掼蛋大厅"><span class="brand-icon">♠</span><div>星曜掼蛋<small>和搭档，好好打一局</small></div></a><div class="header-tools"><span class="offline"><i></i> 离线</span><button class="icon-button" id="help" aria-label="玩法说明">?</button><button class="icon-button" id="settings" aria-label="设置">⚙</button></div></header>
<main id="lobby">
 <section class="hero"><div class="eyebrow">四人一桌 · 两人一队</div><h1>好牌，<br><span>慢慢打。</span></h1><p>和阿曜搭档，从 2 一起打到 A。<br>没有广告，不用联网，随时接着上局玩。</p><div class="hero-cards" aria-hidden="true"><div class="hero-card hc1">A<span>♠</span></div><div class="hero-card hc2">2<span>♥</span><small>逢人配</small></div><div class="hero-card hc3">A<span>♣</span></div></div><div class="hero-tags"><span>108 张双副牌</span><span>原创轻音乐</span><span>大牌选牌</span></div></section>
 <section class="modes"><div class="section-title"><span>选一张牌桌</span><button class="text-button" id="quick-guide">3 步上手 ↗</button></div><button class="resume-table" id="resume-table" hidden><span>继续未完牌局<small id="resume-summary"></small></span><b>继续 →</b></button><button class="mode primary" data-mode="classic"><span class="mode-icon">♠</span><div><small>与阿曜搭档</small><h2>经典升级</h2><p>从 2 打到 A · 自动保存进度</p></div><b>→</b></button><div class="mode-grid"><button class="mode" data-mode="quick"><span class="mode-icon">ϟ</span><div><h2>快速开局</h2><p>随机级牌，来一局就好</p></div><b>↗</b></button><button class="mode" data-mode="practice"><span class="mode-icon">✦</span><div><h2>明牌练习</h2><p>看四家手牌，慢慢学</p></div><b>↗</b></button></div><div class="stats"><div><strong id="stat-rounds">0</strong><span>完成对局</span></div><div><strong id="stat-wins">0</strong><span>搭档胜场</span></div><div><strong id="stat-rate">—</strong><span>胜率</span></div></div><p class="rules-note">休闲升级规则 · 无进贡 / 还贡 · 1 人 + 3 位 AI</p></section>
</main>
<main id="game" hidden>
 <div class="matchbar"><button class="text-button" id="home" aria-label="保存并返回大厅">‹ 大厅</button><div class="match-title"><span id="mode-label">经典升级</span><span class="pill">打 <b id="level-label">2</b></span><span class="level-wild" id="wild-reminder">♥2 百搭</span></div><div class="match-tools"><button class="text-button" id="history-top">记录</button><button class="text-button" id="music" aria-label="开启背景音乐">♫ 关</button><button class="text-button" id="orientation">横屏</button><button class="icon-button" id="game-settings" aria-label="牌桌设置">⚙</button></div></div>
 <section class="table" aria-label="四家牌桌"><div class="table-line"></div><div class="watermark" aria-hidden="true">星曜<small>GUANDAN CLUB</small></div><div class="seat seat-top" id="seat-2"></div><div class="seat seat-left" id="seat-1"></div><div class="seat seat-right" id="seat-3"></div><div id="played" class="trick-center"></div><div class="seat-play play-top" id="play-seat-2"></div><div class="seat-play play-left" id="play-seat-1"></div><div class="seat-play play-right" id="play-seat-3"></div><div class="seat-play play-bottom" id="play-seat-0"></div><div class="team-score"><span>我方 <b id="score-us">2</b></span><span>对方 <b id="score-them">2</b></span></div><div class="table-utilities"><button id="previous-trick" class="history-button">上轮回看</button><button id="history" class="history-button">记录</button><button id="table-help" class="history-button" aria-label="查看玩法">?</button></div></section>
 <section class="player-zone"><div class="turn-banner" id="table-status" role="status">你的搭档坐在对面</div><div class="player-meta"><div><span class="you-avatar">♠</span><b>你</b><span id="hand-count">27 张</span><span id="turn-status"></span></div><div class="hand-tools"><button class="text-button" id="sort">点数排序 ⇅</button><button class="text-button" id="expand-hand">展开选牌</button><button class="text-button" id="auto">托管 关</button></div></div><div class="hand" id="hand" aria-label="你的手牌，点击选中或取消"></div><div class="selection-line"><div id="selection-status" class="selection-status" aria-live="polite">点牌选中，再点出牌</div><button class="text-button" id="undo" disabled>撤销选择</button><button class="text-button" id="clear" disabled>清空</button></div><div class="actionbar"><button class="secondary" id="pass">不出</button><button class="secondary" id="hint">提示</button><button class="play-button" id="play" disabled>出牌</button></div></section>
</main>
<div id="toast" role="status"></div><dialog id="modal"><button class="modal-close" id="modal-close" aria-label="关闭">×</button><div id="modal-content"></div></dialog><script type="module" src="game.js"></script>
</body></html>
